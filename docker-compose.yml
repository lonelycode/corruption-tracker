#
# One-command deploy of the Corruption & Fraud Tracker.
#
#   1. Put this file and a .env next to each other. The only required
#      setting is the database password (see .env.example):
#        echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" > .env
#   2. docker compose up -d
#   3. Open http://localhost:8080 and create the first admin account.
#
# Everything else (site name, LLM key, mailbox, news feeds) is set on the
# admin Settings page. On a server with a domain name, set TRACKER_DOMAIN
# and COMPOSE_PROFILES=https in .env: Caddy then serves the tracker over
# HTTPS with an automatic Let's Encrypt certificate.
#
# Data lives in named volumes (db, data), so `docker compose down` and
# `up -d` keep it. Only `down -v` deletes it.

name: corruption-tracker

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_DB: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      timeout: 3s
      retries: 20

  tracker:
    image: ${TRACKER_IMAGE:-ghcr.io/lonelycode/corruption-tracker:latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Use a URL-safe password (the hex one-liner above is).
      DATABASE_URL: postgres://tracker:${POSTGRES_PASSWORD}@db:5432/tracker?sslmode=disable
      # Behind Caddy (a domain is set), trust its X-Forwarded-* headers;
      # without one, nothing sits in front, so trust none.
      TRACKER_TRUST_PROXY: ${TRACKER_DOMAIN:+1}
      # Optional (.env): derive the key that encrypts stored secrets from
      # this instead of the generated /data/secret.key. Set it before the
      # first secret is saved, or never. Switching later doesn't lose data,
      # but the LLM key and mailbox password must be re-entered on Settings.
      # No value here on purpose: unset in .env means unset in the container.
      TRACKER_SECRET:
    volumes:
      - data:/data
    # Loopback only by default: open it from this machine, or put it
    # behind the https profile. TRACKER_BIND=0.0.0.0 exposes plain HTTP.
    ports:
      - "${TRACKER_BIND:-127.0.0.1}:${TRACKER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 30s

  caddy:
    image: caddy:2.10-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      tracker:
        condition: service_healthy
    # Let's Encrypt needs 80 and 443 reachable from the internet; the
    # overrides are for machines where something else holds them.
    ports:
      - "${TRACKER_HTTP_PORT:-80}:80"
      - "${TRACKER_HTTPS_PORT:-443}:443"
      - "${TRACKER_HTTPS_PORT:-443}:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config

configs:
  # The setup wizard's "Start from an export" upload carries its CSRF token
  # in the URL query, so the access log drops it, and the Referer that can
  # repeat it. Caddy already redacts cookies and Authorization headers.
  caddyfile:
    content: |
      ${TRACKER_DOMAIN:-localhost} {
        encode gzip
        reverse_proxy tracker:8080
        log {
          output stdout
          format filter {
            request>uri query {
              delete csrf_token
            }
            request>headers>Referer delete
          }
        }
      }

volumes:
  db:
  data:
  caddy_data:
  caddy_config:
