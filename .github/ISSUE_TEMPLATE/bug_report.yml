name: Bug report
description: Something in the software doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **No real data.** Don't include real names, case details, court file numbers or exported data, here or in attachments. Use synthetic examples. Security problems, including anything that could reveal a withheld name, go to [private vulnerability reporting](https://github.com/lonelycode/corruption-tracker/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: The version and commit on the About page (/about), or the image tag.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How you run it
      options:
        - docker compose (this repository's stack)
        - the binary, outside Docker
        - embedded in another application
        - other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: With synthetic data only.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant `docker compose logs tracker` lines. Remove names, addresses and secrets first.
      render: text
  - type: checkboxes
    id: nodata
    attributes:
      label: Confirmation
      options:
        - label: This report contains no real personal data, case details or secrets.
          required: true
